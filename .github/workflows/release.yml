name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  build-x86_64:
    name: Build (x86_64-linux)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Build release binary
        run: cargo build --release

      - name: Package artifact
        run: |
          TAG="${{ github.ref_name }}"
          cp target/release/srkt "srkt-${TAG}-x86_64-linux"
          sha256sum "srkt-${TAG}-x86_64-linux" > "srkt-${TAG}-x86_64-linux.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-linux
          path: |
            srkt-*-x86_64-linux
            srkt-*-x86_64-linux.sha256

  build-aarch64:
    name: Build (aarch64-linux)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Build release binary
        run: cargo build --release

      - name: Package artifact
        run: |
          TAG="${{ github.ref_name }}"
          cp target/release/srkt "srkt-${TAG}-aarch64-linux"
          sha256sum "srkt-${TAG}-aarch64-linux" > "srkt-${TAG}-aarch64-linux.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-linux
          path: |
            srkt-*-aarch64-linux
            srkt-*-aarch64-linux.sha256

  github-release:
    name: GitHub Release
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: x86_64-linux

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: aarch64-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            srkt-*-x86_64-linux
            srkt-*-x86_64-linux.sha256
            srkt-*-aarch64-linux
            srkt-*-aarch64-linux.sha256

  publish-crates:
    name: Publish to crates.io
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
