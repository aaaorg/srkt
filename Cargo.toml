[package]
name = "srkt"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "srkt"
path = "src/main.rs"

[dependencies]
# Input reading
evdev = { version = "0.12", features = ["tokio"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-stream = "0.1"

# Wayland
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }

# XKB keyboard layout
xkbcommon = "0.7"

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# CLI
clap = { version = "4", features = ["derive"] }

# File watching
notify = "6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Unix primitives
nix = { version = "0.29", features = ["signal", "fs"] }

# Error handling
anyhow = "1"

# System calls
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true
